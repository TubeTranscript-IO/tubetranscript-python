name: CI

# Tests, lints and builds on every push and pull request. Pushing a tag
# `v<version>` (matching src/tubetranscript/_version.py) publishes to PyPI
# through Trusted Publishing, after a maintainer approves the `pypi`
# environment. No token is stored in this repository. See RELEASING.md.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (Python ${{ matrix.python }}, youtube-transcript-api ${{ matrix.upstream }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        upstream: ["1.2.0", "latest"]
        exclude:
          # youtube-transcript-api 1.2.0-1.2.2 declare Requires-Python <3.14; on 3.14 pip resolves 1.2.3+.
          - python: "3.14"
            upstream: "1.2.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          if [ "${{ matrix.upstream }}" != "latest" ]; then
            python -m pip install "youtube-transcript-api==${{ matrix.upstream }}"
          fi
      - run: python -m pytest -q

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -I -c "import tubetranscript as t; print(t.__version__)"
          /tmp/smoke/bin/tubetranscript --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/tubetranscript/
    # Job-level permissions replace the workflow's: only the OIDC token. No checkout: it publishes exactly the files
    # the build job made.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Tag must match the built version
        run: |
          version="${GITHUB_REF_NAME#v}"
          ls dist/
          if [ ! -f "dist/tubetranscript-${version}-py3-none-any.whl" ] || [ ! -f "dist/tubetranscript-${version}.tar.gz" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the built package version (see the files above)" >&2
            exit 1
          fi
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
